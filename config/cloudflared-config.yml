  # SMS relay (smsgw-relay :8787) — replaces Tailscale Funnel :8443
  # Webhooks from callers that cannot send custom headers or log in. Access BYPASS is scoped to
  # exactly these two paths; the relay itself verifies signatures and fails closed:
  #   /sms-hook  Supabase Auth Send-SMS hook   -> Standard Webhooks HMAC (SUPABASE_HOOK_SECRET)
  #   /inbound   SMS Gateway for Android hook  -> X-Signature HMAC (SMSGW_WEBHOOK_SIGNING_KEY)
  - hostname: sms.voicecommandapi.com
    path: "^/(sms-hook|inbound)/?$"
    service: http://127.0.0.1:8787

  # Machine callers that CAN send headers (gcr-api-clean on Vercel) use an Access service token
  # (CF-Access-Client-Id / CF-Access-Client-Secret) and still send X-Relay-Secret. /health is for
  # Matt (browser login) and the uptime check (service token). cloudflared validates the Access JWT.
  - hostname: sms.voicecommandapi.com
    path: "^/(send|health)/?$"
    service: http://127.0.0.1:8787
    originRequest:
      access:
        required: true
        teamName: autumn-bread-a4ec
        audTag:
          - a27101e81943cd52a5274c60ed4bf62662a7043a09a68bfe73840d23fce05c2f

  - hostname: sms.voicecommandapi.com
    service: http_status:404

  - service: http_status:404
