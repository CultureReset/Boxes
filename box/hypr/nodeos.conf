# NODE on Hyprland — classic hyprland.conf syntax, for non-Lua Hyprland setups.
# source = ~/.config/hypr/nodeos.conf

windowrulev2 = fullscreen, class:^(nodeos-shell)$
windowrulev2 = workspace 1, class:^(nodeos-shell)$
windowrulev2 = noanim, class:^(nodeos-shell)$
windowrulev2 = noborder, class:^(nodeos-shell)$
windowrulev2 = norounding, class:^(nodeos-shell)$
windowrulev2 = noshadow, class:^(nodeos-shell)$
windowrulev2 = opacity 1.0 override 1.0 override, class:^(nodeos-shell)$
windowrulev2 = suppressevent fullscreen maximize, class:^(nodeos-shell)$

# One app at a time, full width. Delete to keep classic tiling.
windowrulev2 = maximize, class:^(?!nodeos-shell$).*$, floating:0

bindr = SUPER, SUPER_L, exec, nodeos home
bind = SUPER, H, exec, nodeos home
bind = , XF86HomePage, exec, nodeos home

exec-once = nodeos start
